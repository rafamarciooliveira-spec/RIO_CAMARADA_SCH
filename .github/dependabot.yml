version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      firebase:
        patterns: ["firebase", "firebase-*", "@firebase/*"]
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /tools/lint
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
